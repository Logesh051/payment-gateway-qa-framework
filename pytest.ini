[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --tb=short
markers =
    unit: isolated domain unit tests
    api: functional API contract and endpoint tests
    negative: negative validation and decline tests
    idempotency: idempotency token and replay tests
    state: payment lifecycle state transition tests
    webhook: HMAC-SHA256 webhook and signature tests
    integration: database persistence and double-entry ledger tests
    concurrency: multi-threaded race condition tests
